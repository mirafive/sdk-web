name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # format, lint, types, tests, build, and the package as an app installs it
    uses: mirafive/.github/.github/workflows/js-sdk.yml@4a3a98aff1063c5b26327656bf26f7b117de02fb
    with:
      script-budget: 9216
